[build]
# Windows: begrenzt die Job-Zahl — und damit auch `cmake --build --parallel N`,
# denn cmake-rs leitet sie aus cargos NUM_JOBS ab.
#
# Warum das nötig ist: ggml baut mit GGML_CPU_ALL_VARIANTS=ON viele CPU-Varianten
# als eigene MSBuild-Projekte (ggml-cpu-sse42-feats, -sandybridge-feats, …). Bei
# voller Parallelität fassen mehrere davon gleichzeitig dieselbe Datei
# `ggml/src/CMakeFiles/generate.stamp` an; Windows verweigert den konkurrierenden
# Zugriff, CMake bricht mit „Cannot restore timestamp … Zugriff verweigert" ab und
# meldet anschließend irreführend „configure_file: No such file or directory".
# Siehe BUILD.md → Troubleshooting.
#
# Kostet beim ersten Bauen Zeit, danach kaum: Rust-Änderungen betreffen nur noch
# das murmel-Crate selbst. Wer keinen nativen Neubau erwartet, kann pro Aufruf
# mit `cargo build -j 16` übersteuern.
jobs = 4

# Build-Umgebung für den nativen Teil (transcribe-cpp / ggml).
#
# Diese Werte gelten NUR beim Kompilieren — die fertige App liest sie nie.
# Sie stehen hier im Projekt, damit der Build nicht davon abhängt, welche
# Variablen in der jeweiligen Shell zufällig gesetzt sind.
#
# Cargo überschreibt eine bereits gesetzte Umgebungsvariable hier bewusst NICHT.
# Wer das SDK aktualisiert, kann die globale Variable setzen (der LunarG-Installer
# tut das ohnehin) — sie gewinnt dann gegen diesen Eintrag.
[env]
# Vulkan SDK: liefert die Header und den Shader-Compiler `glslc`, die ggml für
# den GPU-Backend-Build braucht. Installiert über:
#   winget install KhronosGroup.VulkanSDK
VULKAN_SDK = 'C:\VulkanSDK\1.4.357.0'
