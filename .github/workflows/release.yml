name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The one place a version number lives. tauri.conf.json has no `version`
      # field on purpose — Tauri falls back to this one, so `cargo set-version`
      # is the only step in a version bump and nothing can drift out of step.
      - name: Get version from Cargo.toml
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in src-tauri/Cargo.toml"
            exit 1
          fi
          echo "Application version from Cargo.toml: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent. It is not a target platform
        # (Murmel_Northstar.md §3), so nobody installs these artifacts — and
        # building them cannot work anyway: tauri-bundler signs unconditionally
        # once APPLE_CERTIFICATE exists in the environment, and the workflow
        # sets it to an empty string rather than leaving it unset. The result
        # was a release that reported failure every single time, which buries
        # the failures that actually matter.
        #
        # Adding it back means restoring these two entries and providing an
        # Apple Developer certificate.
        include:
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "murmel"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  # Publish the draft — but only once every build succeeded.
  #
  # The draft used to be released by hand. That step was meant as a check, but a
  # check nobody performs is ceremony: the artifacts went out unexamined, and
  # clicking through it daily trains you to click through it on the day it
  # matters. What it was supposed to catch is something a machine checks better
  # anyway.
  #
  # `needs` does the real work: if any build job fails, this job never runs and
  # the release stays a draft — visible on GitHub, invisible to the updater,
  # waiting for someone to look. Releasing regardless is the failure mode worth
  # preventing: the updater reads `latest.json` from whatever is marked
  # "latest", so a release missing the Windows entry would leave every
  # installation unable to find an update, publicly and under your name.
  publish-release:
    needs: [create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Second line of defence: a job can report success without its artifact
      # ever reaching the release. Murmel's target platforms are Windows and
      # Ubuntu (Murmel_Northstar.md §1), so those two entries must exist —
      # the ARM builds are a bonus and not worth blocking a release over.
      - name: Verify the updater manifest covers the target platforms
        uses: actions/github-script@v9
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release-id }};
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            const manifest = assets.find((asset) => asset.name === 'latest.json');
            if (!manifest) {
              throw new Error('latest.json is missing — the updater would have nothing to read.');
            }

            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: manifest.id,
                headers: { accept: 'application/octet-stream' },
              },
            );

            const parsed = JSON.parse(Buffer.from(response.data).toString('utf8'));
            const missing = ['windows-x86_64', 'linux-x86_64'].filter(
              (platform) => !parsed.platforms?.[platform]?.url,
            );

            if (missing.length > 0) {
              throw new Error(`latest.json has no entry for: ${missing.join(', ')}`);
            }

            core.info(`latest.json covers ${Object.keys(parsed.platforms).length} platform keys.`);

      - name: Publish the release
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false,
              make_latest: 'true',
            });
            core.info('Release published — installations will find it on their next check.');
